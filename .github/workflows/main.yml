name: Android CI

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Install NDK
        run: echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;17.2.4988734" --sdk_root=${ANDROID_SDK_ROOT}
      - name: Install legacy NDK dependency
        run: sudo apt-get update && sudo apt-get install -y libtinfo5
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew test :common:build assembleRelease
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenDroidAuto-APK
          path: app/build/outputs/apk/release/HondaAppCenter_A1.apk
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenDroidAuto-APK
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/HondaAppCenter_A1.apk
